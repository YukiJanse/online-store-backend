version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  user-order-service:
    restart: always
    build: ./user-order-service
    container_name: user-order-service
    depends_on:
      - postgres
    ports:
      - "5000:5000"
    environment:
      DB_PASSWORD: password
      DB_URL: jdbc:postgresql://postgres:5432/mydb
      DB_USER: user
      PRODUCT_API_BASE_URL: http://product-service:5001/v1/products
      JWT_PRIVATE_KEY: 
      JWT_PUBLIC_KEY: 

  product-service:
    restart: always
    build: ./product-service
    container_name: product-service
    depends_on:
      - postgres
    ports:
      - "5001:5001"
    environment:
      DB_PASSWORD: password
      DB_URL: jdbc:postgresql://postgres:5432/mydb
      DB_USER: user
      JWT_PRIVATE_KEY: 
      JWT_PUBLIC_KEY: 

volumes:
  postgres-data: